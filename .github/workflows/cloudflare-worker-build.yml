name: Cloudflare Worker build

on:
  push:
    branches: [develop]
    paths:
      - "cloudflare/t2s-tts-worker/**"
      - ".github/workflows/cloudflare-worker-build.yml"
  pull_request:
    branches: [develop]
    paths:
      - "cloudflare/t2s-tts-worker/**"
      - ".github/workflows/cloudflare-worker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2s-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/t2s-tts-worker
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Worker
        run: npm run typecheck
      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-build
