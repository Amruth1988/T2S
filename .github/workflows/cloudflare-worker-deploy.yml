name: Deploy Cloudflare TTS Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2s-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/t2s-tts-worker
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Worker
        run: npm run typecheck
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          if grep -Eq 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml; then
            echo "Configure the real t2s-usage D1 database_id in wrangler.toml before deployment."
            exit 1
          fi
          npx wrangler d1 migrations apply t2s-usage --remote
          npx wrangler deploy
      - name: Verify deployed Worker health
        run: |
          response="$(curl --fail --silent --show-error https://t2s.amruth4official.workers.dev/health)"
          echo "$response"
          echo "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const health = JSON.parse(data);
              if (health.ok !== true || health.service !== "t2s-tts-worker") process.exit(1);
              if (health.usageQuota !== true) {
                console.error("The remote D1 usage database is not bound to the Worker.");
                process.exit(1);
              }\n              if (!health.providers?.vakyam) {
                console.error("VAKYAM_API_KEY is not configured as a Cloudflare Worker secret.");
                process.exit(1);
              }
            });
          '
