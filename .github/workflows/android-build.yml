name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t2s-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up shared signing key
        env:
          T2S_SIGNING_KEY_BASE64: ${{ secrets.T2S_SIGNING_KEY_BASE64 }}
          T2S_KEYSTORE_PASSWORD: ${{ secrets.T2S_KEYSTORE_PASSWORD }}
          T2S_KEY_ALIAS: ${{ secrets.T2S_KEY_ALIAS }}
          T2S_KEY_PASSWORD: ${{ secrets.T2S_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$T2S_SIGNING_KEY_BASE64" || { echo "Missing GitHub Actions secret: T2S_SIGNING_KEY_BASE64"; exit 1; }
          test -n "$T2S_KEYSTORE_PASSWORD" || { echo "Missing GitHub Actions secret: T2S_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$T2S_KEY_ALIAS" || { echo "Missing GitHub Actions secret: T2S_KEY_ALIAS"; exit 1; }
          test -n "$T2S_KEY_PASSWORD" || { echo "Missing GitHub Actions secret: T2S_KEY_PASSWORD"; exit 1; }
          echo "$T2S_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/t2s-shared-signing.p12"
          echo "T2S_KEYSTORE_FILE=$RUNNER_TEMP/t2s-shared-signing.p12" >> "$GITHUB_ENV"
          echo "T2S_KEYSTORE_PASSWORD=$T2S_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "T2S_KEY_ALIAS=$T2S_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "T2S_KEY_PASSWORD=$T2S_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"

      - name: Build Debug and Release APKs
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Prepare direct APK download
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk T2S.apk

      - name: Upload APK to this build
        if: always() && github.event_name != 'pull_request' && hashFiles('T2S.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: T2S-APK
          path: T2S.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish T2S.apk as a direct download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: t2s-build-${{ github.run_number }}
          name: T2S Build #${{ github.run_number }}
          files: T2S.apk
          draft: false
          prerelease: false
          make_latest: false
