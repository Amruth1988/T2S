name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t2s-android-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up shared signing key
        env:
          T2S_SIGNING_KEY_BASE64: ${{ secrets.T2S_SIGNING_KEY_BASE64 }}
          T2S_KEYSTORE_PASSWORD: ${{ secrets.T2S_KEYSTORE_PASSWORD }}
          T2S_KEY_ALIAS: ${{ secrets.T2S_KEY_ALIAS }}
          T2S_KEY_PASSWORD: ${{ secrets.T2S_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$T2S_SIGNING_KEY_BASE64" || { echo "Missing GitHub Actions secret: T2S_SIGNING_KEY_BASE64"; exit 1; }
          test -n "$T2S_KEYSTORE_PASSWORD" || { echo "Missing GitHub Actions secret: T2S_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$T2S_KEY_ALIAS" || { echo "Missing GitHub Actions secret: T2S_KEY_ALIAS"; exit 1; }
          test -n "$T2S_KEY_PASSWORD" || { echo "Missing GitHub Actions secret: T2S_KEY_PASSWORD"; exit 1; }
          echo "$T2S_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/t2s-shared-signing.p12"
          echo "T2S_KEYSTORE_FILE=$RUNNER_TEMP/t2s-shared-signing.p12" >> "$GITHUB_ENV"
          echo "T2S_KEYSTORE_PASSWORD=$T2S_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "T2S_KEY_ALIAS=$T2S_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "T2S_KEY_PASSWORD=$T2S_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"

      - name: Build Debug and Release APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      # GitHub Actions artifacts are always ZIP files. Publish APKs as
      # individual GitHub Release assets so Android users can download .apk directly.
      - name: Prepare ABI-specific APK downloads
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/release/app-${abi}-release.apk"
            test -s "$apk"
            cp "$apk" "dist/T2S-${abi}.apk"
          done

      - name: Publish T2S APK files as direct downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: t2s-build-${{ github.run_number }}
          name: T2S Build #${{ github.run_number }}
          files: |
            dist/T2S-arm64-v8a.apk
            dist/T2S-armeabi-v7a.apk
          draft: false
          prerelease: false
          make_latest: false

      - name: Add direct APK link to build summary
        if: success()
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "## T2S Android APK downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ARM64 (most modern Android phones)](https://github.com/$GH_REPOSITORY/releases/download/t2s-build-$GH_RUN_NUMBER/T2S-arm64-v8a.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ARMv7 (32-bit ARM devices)](https://github.com/$GH_REPOSITORY/releases/download/t2s-build-$GH_RUN_NUMBER/T2S-armeabi-v7a.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install only the APK matching the device CPU architecture." >> "$GITHUB_STEP_SUMMARY"
