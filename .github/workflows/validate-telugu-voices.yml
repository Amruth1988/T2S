name: Validate Telugu Piper voice packs

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/convert_piper_model.py"
      - "tools/validate_piper_synthesis.py"
      - ".github/workflows/validate-telugu-voices.yml"

permissions:
  contents: read

jobs:
  convert-and-synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out T2S
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install conversion and inference tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx==1.17.0 sherpa-onnx
          python -m pip install piper-phonemize -f https://k2-fsa.github.io/icefall/piper_phonemize.html

      - name: Download, convert and synthesize Telugu voices
        run: |
          set -euo pipefail
          # Pin the source to the immutable revision that introduced the two CC BY 4.0 Telugu voices.
          source_revision="ff43c1e79f98a765202dcfb03710851f9ec4ff2e"
          base="https://huggingface.co/rhasspy/piper-voices/resolve/$source_revision/te/te_IN"
          for voice in venkatesh padmavathi; do
            dir="build/telugu-voices/$voice"
            mkdir -p "$dir"
            model="te_IN-$voice-medium.onnx"
            curl -fL --retry 3 "$base/$voice/medium/$model" -o "$dir/$model"
            curl -fL --retry 3 "$base/$voice/medium/$model.json" -o "$dir/$model.json"
            curl -fL --retry 3 "$base/$voice/medium/MODEL_CARD" -o "$dir/MODEL_CARD"
            python tools/convert_piper_model.py "$dir/$model"
            python tools/validate_piper_synthesis.py \
              --model "$dir/$model" \
              --tokens "$dir/tokens.txt" \
              --output "$dir/test.wav" \
              --text "నమస్కారం. ఇది తెలుగు స్వర పరీక్ష."
            test -s "$dir/test.wav"
          done

      - name: Prepare attributed import packs for CC BY 4.0 voices only
        run: |
          set -euo pipefail
          for voice in venkatesh padmavathi; do
            dir="build/telugu-voices/$voice"
            cat > "$dir/ATTRIBUTION.md" <<EOF
          # $voice Telugu voice attribution

          Voice model: rhasspy/piper-voices, te/te_IN/$voice/medium
          Model card: https://huggingface.co/rhasspy/piper-voices/blob/$source_revision/te/te_IN/$voice/medium/MODEL_CARD
          Source revision: rhasspy/piper-voices@$source_revision
          Trainer: PravalX (https://github.com/PravalX)
          Training dataset: AI4Bharat IndicVoices-R (https://huggingface.co/datasets/ai4bharat/indicvoices_r)
          Dataset/model-card licence: Creative Commons Attribution 4.0 International (CC BY 4.0)
          Licence text: LICENSE-CC-BY-4.0.txt
          Dataset citation: Ashwin Sankar et al., "IndicVoices-R: Unlocking a Massive Multilingual Multi-speaker Speech Corpus for Scaling Indian TTS", NeurIPS 2024.
          Upstream Piper model repository: https://huggingface.co/rhasspy/piper-voices
          EOF
            curl -fL --retry 3 https://creativecommons.org/licenses/by/4.0/legalcode.txt -o "$dir/LICENSE-CC-BY-4.0.txt"
            test -s "$dir/ATTRIBUTION.md"
            test -s "$dir/LICENSE-CC-BY-4.0.txt"
            # Record SHA-256 for every source/licence file shipped in the pack.
            (cd "$dir" && sha256sum "$model" "$model.json" MODEL_CARD ATTRIBUTION.md LICENSE-CC-BY-4.0.txt > SOURCE_MANIFEST.sha256)
            test -s "$dir/SOURCE_MANIFEST.sha256"
          done
          # Maya is synthesis-tested above, but IITM IndicTTS terms have
          # not been cleared for redistribution. Keep its weights out of artifacts.
          rm -rf build/telugu-voices/maya
          test -s build/telugu-voices/venkatesh/ATTRIBUTION.md
          test -s build/telugu-voices/padmavathi/ATTRIBUTION.md

      - name: Build versioned automatic-install archives
        run: |
          set -euo pipefail
          for voice in venkatesh padmavathi; do
            dir="build/telugu-voices/$voice"
            archive="build/t2s-telugu-$voice-v1.zip"
            (cd build/telugu-voices && zip -qr "../$(basename "$archive")" "$voice")
            sha256sum "$archive" > "$archive.sha256"
            test -s "$archive"
            test -s "$archive.sha256"
          done

      - name: Initialize public voice-pack repository if empty
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VOICE_PACKS_TOKEN }}
          script: |
            const owner = "Amruth1988";
            const repo = "T2S-VoicePacks";
            try {
              await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
              core.info("Public voice-pack repository already has main; no initialization needed.");
            } catch (error) {
              if (error.status !== 404) throw error;
              const blob = await github.rest.git.createBlob({
                owner, repo,
                content: "# T2S Telugu Voice Packs\n\nPublic distribution repository for validated, versioned Telugu offline TTS voice packs used by T2S Studio. Releases contain ZIP archives and SHA-256 checksum sidecars for verified in-app installation.\n",
                encoding: "utf-8"
              });
              const tree = await github.rest.git.createTree({
                owner, repo,
                tree: [{ path: "README.md", mode: "100644", type: "blob", sha: blob.data.sha }]
              });
              const commit = await github.rest.git.createCommit({
                owner, repo,
                message: "docs: initialize Telugu voice pack distribution repository",
                tree: tree.data.sha,
                parents: []
              });
              await github.rest.git.createRef({
                owner, repo,
                ref: "refs/heads/main",
                sha: commit.data.sha
              });
              core.info("Initialized public voice-pack repository with README.md.");
            }

      - name: Publish stable Telugu voice-pack release to public repository
        uses: softprops/action-gh-release@v2
        with:
          repository: Amruth1988/T2S-VoicePacks
          token: ${{ secrets.VOICE_PACKS_TOKEN }}
          tag_name: telugu-voice-packs-v1
          target_commitish: main
          name: T2S Telugu Voice Packs v1
          body: |
            Versioned, attributed Telugu Piper voice packs for automatic in-app installation.
            Each archive includes model weights, tokens, model card, attribution, licence notice and a SHA-256 source manifest. The model source is pinned to rhasspy/piper-voices revision ff43c1e79f98a765202dcfb03710851f9ec4ff2e.
            T2S verifies the SHA-256 checksum before installing a pack.
          files: |
            build/t2s-telugu-venkatesh-v1.zip
            build/t2s-telugu-venkatesh-v1.zip.sha256
            build/t2s-telugu-padmavathi-v1.zip
            build/t2s-telugu-padmavathi-v1.zip.sha256
          fail_on_unmatched_files: true
          make_latest: false

      - name: Upload attributed Telugu import packs and synthesis samples
        uses: actions/upload-artifact@v4
        with:
          name: t2s-telugu-piper-import-packs
          path: |
            build/telugu-voices/venkatesh/
            build/telugu-voices/padmavathi/
          if-no-files-found: error
          retention-days: 7
