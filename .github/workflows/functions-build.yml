name: Functions typecheck

on:
  push:
    branches: [main, develop]
    paths:
      - "functions/**"
      - ".github/workflows/functions-build.yml"
  pull_request:
    branches: [develop]
    paths:
      - "functions/**"
      - ".github/workflows/functions-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2s-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Firebase Functions
        run: npm run build
